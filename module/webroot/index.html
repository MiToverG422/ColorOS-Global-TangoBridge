<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>TangoBridge · 运行检测</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="i18n.js"></script>
  <script defer src="health.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <header><div class="brand"><span class="logo" aria-hidden="true">T</span><div><strong>TangoBridge</strong><small>ColorOS Global · ARM32</small></div></div></header>
  <section class="hero" aria-labelledby="hero-title">
    <h1 id="hero-title" tabindex="-1">概览</h1>
    <div class="toolbar"><button id="refresh" class="primary" data-i18n="refresh">刷新</button><span id="updated" role="status" aria-live="polite"></span></div>
  </section>
  <div id="notice" class="notice" role="alert" hidden></div>
  <div id="page-overview" class="page">
  <section id="overview" class="overview" aria-live="polite">
    <span id="status-mark" class="status-mark" aria-hidden="true">…</span>
    <div><h2 id="status-title" data-i18n="waiting">尚未检测</h2><p id="status-description"></p></div>
  </section>
  <div class="metrics"><article><span data-i18n="compat">系统适配</span><strong id="compat">—</strong></article><article><span data-i18n="runtime">32 位服务</span><strong id="runtime">—</strong></article><article><span>SELinux</span><strong id="selinux">—</strong></article></div>
  <section class="panel"><div class="section-heading"><h2 data-i18n="device">设备</h2><span id="version" class="muted">—</span></div><dl id="device" class="device"></dl><details class="more"><summary data-i18n="details">更多信息</summary><dl id="device-extra" class="device"></dl></details></section>
  </div>
  <div id="page-checks" class="page" hidden>
  <section class="panel"><div class="section-heading"><h2 data-i18n="checks">检测</h2><span id="check-count" class="muted">—</span></div><div id="checks"><p class="placeholder" data-i18n="waiting">尚未检测</p></div></section>
  </div>
  <div id="page-diagnostics" class="page" hidden>
  <section class="panel"><div class="section-heading"><h2 data-i18n="diagnostics">诊断</h2></div><p class="muted" data-i18n="privacy">分享日志前，请检查应用路径等信息。</p><div class="tools"><button id="report" disabled data-i18n="report">生成摘要</button><button id="logs" disabled data-i18n="logs">启动日志</button></div><div id="report-box" hidden><label for="report-text" data-i18n="reportTitle">诊断摘要</label><textarea id="report-text" readonly rows="10"></textarea><button id="copy" data-i18n="copy">复制</button></div><details id="log-box" hidden><summary data-i18n="logTitle">最近 120 行</summary><pre id="log-text"></pre></details></section>
  </div>
  <div id="page-settings" class="page" hidden>
    <section class="panel settings-panel">
      <label class="setting-row" for="language"><span data-i18n="language">语言</span><select id="language"><option value="auto" data-i18n="auto">跟随系统</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
      <label class="setting-row" for="fullscreen"><span><span data-i18n="fullscreen">全屏显示</span><small id="fullscreen-hint" data-i18n="fullscreenHint">默认关闭</small></span><input id="fullscreen" type="checkbox" role="switch"></label>
    </section>
    <footer><span data-i18n="applicable">适用版本</span> · 16.0.10.500(EX01)</footer>
  </div>
</main>
<nav class="bottom-nav" aria-label="TangoBridge">
  <a href="#overview" data-page="overview" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-i18n="overview">概览</span></a>
  <a href="#checks" data-page="checks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 7v5c0 5-9 9-9 9s-9-4-9-9V7Z"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="checks">检测</span></a>
  <a href="#diagnostics" data-page="diagnostics"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 9 3 3-3 3m5 0h3"/></svg><span data-i18n="diagnostics">诊断</span></a>
  <a href="#settings" data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span data-i18n="settings">设置</span></a>
</nav>
</body>
</html>
