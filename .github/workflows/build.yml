name: Build module

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate build logic and shell syntax
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/build.py scripts/build_network_tool.py
          node --test tests/test_health.cjs tests/test_i18n.cjs tests/test_monitor.cjs tests/test_webui.cjs
          node --check module/webroot/app.js
          node --check module/webroot/monitor.js
          cc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_fd_compat.c -o /tmp/test-fd-compat -ldl
          /tmp/test-fd-compat
          for script in module/*.sh; do bash -n "$script"; done
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Android NDK and filesystem tools
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and assemble module
        run: python3 scripts/build.py
      - name: Upload module ZIP, checksums and build provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ColorOS-Global-TangoBridge-cph2841-ex01-500
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Build summary
        run: |
          echo '### Experimental module built' >> "$GITHUB_STEP_SUMMARY"
          echo 'Applicable system version: 16.0.10.500(EX01). Compatibility is verified by the module checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI validates compilation and packaging, not on-device stability.' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
